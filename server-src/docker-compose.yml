# 로컬 개발용 DB와 Redis
#   준비: .env 파일에 DB_USERNAME, DB_PASSWORD 채워 두기 (docker compose가 .env를 자동으로 읽음)
#   실행: docker compose up -d
#   종료: docker compose down        (데이터 유지)
#   초기화: docker compose down -v   (데이터까지 삭제)
services:
  postgres:
    # PostgreSQL 17 + PostGIS 3.5. 처음 실행할 때 bbolbbol DB에 postgis 확장이 자동으로 설치됨
    image: postgis/postgis:17-3.5
    # 공식 PostGIS 이미지는 Intel(amd64)용만 있어서, 애플 실리콘 맥에서는 에뮬레이션(Rosetta)으로 실행함
    platform: linux/amd64
    container_name: bbolbbol-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-bbolbbol}
      POSTGRES_USER: ${DB_USERNAME:?.env에 DB_USERNAME을 설정하세요}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD를 설정하세요}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      # 127.0.0.1: 내 컴퓨터에서만 접속 가능 (같은 와이파이의 다른 기기에서는 접속 불가)
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-bbolbbol}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: bbolbbol-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
