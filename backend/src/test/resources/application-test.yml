spring:
  datasource:
    url: jdbc:h2:mem:bbolbbol;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway가 소유한다. Hibernate는 테이블을 만들지 않는다

# DEV ONLY: 테스트용 가짜 키
jwt:
  secret: dev-only-FAKE-test-secret-do-not-use-in-prod-0123456789
