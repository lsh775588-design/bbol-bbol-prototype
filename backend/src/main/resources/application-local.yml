# local 프로파일: MySQL/Redis 없이 이 PC에서 기동한다. 실행: SPRING_PROFILES_ACTIVE=local ./gradlew bootRun
spring:
  datasource:
    url: jdbc:h2:mem:bbolbbol;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    # 개발 전용 시드는 db/seed-local에 둔다(local 프로파일에서만 로드)
    locations: classpath:db/migration,classpath:db/seed-local
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway가 소유한다. Hibernate는 테이블을 만들지 않는다
  data:
    redis:
      # Lettuce는 첫 명령 때 연결하므로 Redis가 없어도 기동은 막히지 않는다.
      repositories:
        enabled: false
      connect-timeout: 1s
      timeout: 1s

# DEV ONLY: 아래 값은 일부러 가짜로 적은 개발용 값이다. 운영에서는 JWT_SECRET 환경변수를 쓴다.
jwt:
  secret: dev-only-FAKE-local-secret-do-not-use-in-prod-0123456789

bbolbbol:
  local:
    # DEV ONLY: 토큰이 없으면 이 userId로 인증한다(LocalFixedUserFilter). 비우면 비활성.
    fixed-user-id: 1
