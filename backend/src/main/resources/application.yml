spring:
  application:
    name: bbolbbol
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3307/bbolbbol}
    username: ${MYSQL_USER:}
    password: ${MYSQL_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
  jackson:
    time-zone: Asia/Seoul
